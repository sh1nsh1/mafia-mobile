line-length = 88
fix = true
src = ['app']

[lint]
select = ["I", "FAST", "E", "W", "PERF", "UP"]
ignore = []

[format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[lint.isort]
combine-as-imports = true
length-sort = true
lines-after-imports = 2
known-first-party = ['.\app']
